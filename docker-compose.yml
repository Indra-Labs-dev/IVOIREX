services:
  web:
    build: ./apps/web
    ports: ["43100:80"]
    depends_on: [api]
    networks: [ivoirex]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://ivoirex:change-me-in-production@postgres:5432/ivoirex
      JWT_SECRET: replace-this-development-secret-before-production
      CORS_ORIGINS: http://localhost:43100,http://127.0.0.1:43100
    ports: ["43101:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ivoirex]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ivoirex
      POSTGRES_USER: ivoirex
      POSTGRES_PASSWORD: change-me-in-production
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivoirex -d ivoirex"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ivoirex]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ivoirex]
volumes: { postgres_data: {}, redis_data: {} }
networks: { ivoirex: {} }
